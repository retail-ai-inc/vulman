<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173e35"><title>Vulman — Vulnerability Management</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview"><img src="/icon.svg" alt=""><span>vulman<span class="brand-dot">.</span></span></a>
    <div class="workspace"><div><strong data-t="workspace"></strong><small data-t="localOnly"></small></div><span class="workspace-lock">⌘</span></div>
    <div class="nav-label" data-t="workspaceLabel"></div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom">
      <div class="local-note">
        <strong data-t="localFirst"></strong>
        <small data-t="localDetail"></small>
      </div>
      <button type="button" class="help-button" id="help-button"><span data-t="about"></span><small>v1.1.1</small></button>
    </div>
  </aside>
  <div class="app-shell"><header class="topbar"><div class="breadcrumb"><span class="crumb-icon">◈</span><span data-t="workspace"></span><span>/</span><strong id="breadcrumb-page"></strong></div><div class="topbar-right"><select class="language-select" id="language-select" aria-label="Interface language" disabled></select></div></header><main id="main" tabindex="-1" autofocus><div class="loading">Starting Vulman…</div></main></div>
  <template id="project-form-template">
    <form>
      <div class="project-form-body">
        <div class="form-grid">
          <label><span data-t="projectName"></span><input name="name" required maxlength="120" placeholder="e.g. Customer platform"></label>
          <label><span data-t="schedule"></span><select name="schedule"></select></label>
          <label class="span-2"><span data-t="description"></span><textarea name="description" rows="2" maxlength="4000"></textarea></label>
        </div>
        <p class="form-note" data-t="scheduleHint"></p>
        <section>
          <div class="section-heading">
            <div><h3 data-t="codeScanning"></h3><p data-t="scanRepositoryLocations"></p></div>
            <button type="button" class="button secondary small" data-action="add-repository" data-t="addRepositoryURL"></button>
          </div>
          <p class="notice project-removal-warning" data-project-removal-warning data-t="repositoryRemovalWarning" hidden></p>
          <div class="project-scan-fields">
            <div class="repository-profile-intro"><h4 data-t="repositoryScannerTitle"></h4><p class="form-note" data-t="repositoryScannerHint"></p><p class="form-note" data-t="scannerProfileGlobalHint"></p></div>
            <fieldset class="project-repositories">
              <legend data-t="repositoryURLs"></legend>
              <div class="project-repository-list" data-project-repositories></div>
              <div class="project-github-token">
                <p data-t="privateRepositoryTokenHint"></p>
                <button type="button" class="button secondary small" data-action="configure-github-token" data-t="configureGitHubToken"></button>
              </div>
            </fieldset>
            <div class="folder-picker project-folder-picker">
              <label><span data-t="localPath"></span><input name="local_path" placeholder="/path/to/project or C:\projects\app"></label>
              <button type="button" class="button secondary" data-action="browse-local-repository" data-t="browseFolder"></button>
            </div>
            <div data-local-scanner-profile></div>
            <p class="form-note" data-t="scannerProfileSaveHint"></p>
            <label class="check-row scan-consent"><input type="checkbox" name="scan_code"><span><strong data-t="scanCode"></strong><small data-t="scanConsent"></small></span></label>
          </div>
        </section>
        <section>
          <div class="section-heading">
            <div><h3 data-t="techStack"></h3><p data-t="inventoryHint"></p></div>
            <button type="button" class="button secondary small" data-action="add-project-asset" data-t="addComponent"></button>
          </div>
          <p class="notice project-removal-warning" data-project-removal-warning data-t="componentRemovalWarning" hidden></p>
          <div data-project-assets></div>
          <p class="form-note" data-t="matchingHint"></p>
        </section>
      </div>
      <div class="project-form-actions">
        <p data-project-error class="form-error" role="alert"></p>
        <button type="button" class="button secondary" data-action="cancel-project" data-t="cancel"></button>
        <button type="submit" class="button primary" data-t="saveProject"></button>
      </div>
    </form>
  </template>
  <dialog id="component-dialog"><form id="component-form"><div class="dialog-header"><div><h2 data-t="addComponentTitle"></h2><p class="subtitle" id="component-project"></p></div><button type="button" class="icon-button close-dialog" aria-label="Close">×</button></div><div class="dialog-body"><div id="component-fields"></div><p class="form-note" data-t="matchingHint"></p><p id="component-error" class="form-error" role="alert"></p></div><div class="dialog-footer"><button type="button" class="button secondary close-dialog" data-t="cancel"></button><button type="submit" class="button primary" id="save-component" data-t="saveComponent"></button></div></form></dialog>
  <dialog id="detail-dialog"><div class="dialog-header"><span class="eyebrow" data-t="advisoryDetail"></span><button class="icon-button close-dialog" aria-label="Close">×</button></div><div class="dialog-body" id="detail-body"></div></dialog>
  <dialog id="workflow-failure-dialog" aria-labelledby="workflow-failure-title" aria-describedby="workflow-failure-reason">
    <div class="dialog-header"><h2 id="workflow-failure-title" data-t="workflowStepDetails"></h2><button type="button" class="icon-button close-dialog" aria-label="Close">×</button></div>
    <div class="dialog-body">
      <div id="workflow-failure-status"></div>
      <h3 class="detail-title" id="workflow-failure-step"></h3>
      <p class="workflow-failure-context" id="workflow-failure-context"></p>
      <p class="workflow-failure-progress" id="workflow-failure-progress"></p>
      <p class="workflow-failure-reason" id="workflow-failure-reason"></p>
    </div>
    <div class="dialog-footer"><button type="button" class="button secondary close-dialog" data-t="close"></button></div>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-message"><div class="dialog-body"><p id="confirm-message"></p></div><div class="dialog-footer"><button type="button" class="button secondary close-dialog" data-t="cancel" autofocus></button><button type="button" class="button danger" id="confirm-action" data-t="confirmAction"></button></div></dialog>
  <dialog id="scanner-info-dialog" aria-labelledby="scanner-info-title">
    <div class="dialog-header"><h2 id="scanner-info-title"></h2><button type="button" class="icon-button close-dialog" data-scanner-info-close aria-label="Close" autofocus>×</button></div>
    <div class="dialog-body" id="scanner-info-body" tabindex="0"></div>
    <div class="dialog-footer"><button type="button" class="button secondary close-dialog" data-t="close"></button></div>
  </dialog>
  <dialog id="database-info-dialog" aria-labelledby="database-info-title">
    <div class="dialog-header"><h2 id="database-info-title"></h2><button type="button" class="icon-button close-dialog" data-database-info-close aria-label="Close" autofocus>×</button></div>
    <div class="dialog-body" id="database-info-body" tabindex="0"></div>
    <div class="dialog-footer"><button type="button" class="button secondary close-dialog" data-t="close"></button></div>
  </dialog>
  <dialog id="lockfile-options-dialog" aria-labelledby="lockfile-options-title" aria-describedby="lockfile-options-hint">
    <form id="lockfile-options-form" method="dialog">
      <div class="dialog-header"><h2 id="lockfile-options-title" data-t="scannerLockfileOptions"></h2><button type="button" class="icon-button close-dialog" data-lockfile-options-close aria-label="Close">×</button></div>
      <div class="dialog-body">
        <p data-t="scannerLockfilePrompt"></p>
        <label class="check-row"><input type="checkbox" id="lockfile-options-enabled" autofocus><span><strong data-t="scannerGenerateLockfiles"></strong></span></label>
        <p class="form-note" id="lockfile-options-hint" data-t="scannerGenerateLockfilesHint"></p>
        <div id="lockfile-composer-platform-options" hidden>
          <label class="check-row"><input type="checkbox" id="lockfile-ignore-composer-platform"><span><strong data-t="scannerIgnoreComposerPlatform"></strong></span></label>
          <p class="form-note" data-t="scannerIgnoreComposerPlatformHint"></p>
        </div>
        <p class="form-note" data-t="scannerLockfileSaveHint"></p>
      </div>
      <div class="dialog-footer"><button type="button" class="button secondary close-dialog" data-t="cancel"></button><button type="submit" class="button primary" data-t="scannerLockfileApply"></button></div>
    </form>
  </dialog>
  <dialog id="about-dialog">
    <div class="dialog-header"><h2>Vulman</h2><button class="icon-button close-dialog" aria-label="Close">×</button></div>
    <div class="dialog-body">
      <p data-t="aboutText"></p>
      <p data-t="aboutArchitecture"></p>
      <p data-t="coverageNote"></p>
      <p class="about-security-gift">
        <strong data-t="aboutGiftLabel"></strong>
        <span data-t="aboutGiftMessage"></span>
        <a href="https://github.com/retail-ai-inc/vulman" target="_blank" rel="noreferrer">https://github.com/retail-ai-inc/vulman</a>
      </p>
      <p><a href="https://nvd.nist.gov/developers/vulnerabilities" target="_blank" rel="noreferrer">NVD API ↗</a> · <a href="https://github.com/CVEProject/cvelistV5" target="_blank" rel="noreferrer">CVE Program ↗</a> · <a href="https://google.github.io/osv.dev/" target="_blank" rel="noreferrer">OSV API ↗</a></p>
    </div>
  </dialog>
  <div id="toast" role="status" class="toast" hidden></div>
</body></html>
